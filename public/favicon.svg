<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="spiderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1f2d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#060d1f" stroke="#e62429" stroke-width="2.5" />
  <circle cx="50" cy="50" r="42" stroke="#00d4ff" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
  
