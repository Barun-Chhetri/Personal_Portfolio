    <!-- Right Mid-Bottom Leg -->
    <path d="M54 51 Q68 55 74 66 Q78 75 78 84" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Right Bottom Leg -->
